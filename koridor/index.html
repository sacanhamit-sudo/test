<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Proje Koridoru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime&display=swap">
<style>
/* Düzen: tam ekran WebGL saray koridoru (Dolmabahçe esinli); yanlarda ileri/geri, altta eser bilgisi barı */
:root{
  --bg:#efe4d0;
  --ink:#141210;
  --bar:rgba(24,18,14,.88);
  --on-bar:#f6efe2;
  --muted:#ad9f8b;
  --gold:#e2b25a;
  --rule:rgba(246,239,226,.16);
  --display:'Marcellus','Times New Roman',serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:var(--body)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}

.top{position:fixed;top:0;left:0;right:0;z-index:9;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 18px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{background:var(--bar);color:var(--on-bar);padding:8px 14px;border-radius:999px;
  font-family:var(--display);font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--gold)}
/* hangi koridorda olunduğu: üstte, ortada her zaman görünür */
.halltag{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;gap:10px;align-items:baseline;padding:8px 16px;border-radius:999px;background:var(--bar);color:var(--on-bar);white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2);transition:background .8s ease}
.halltag b{font:500 11px var(--mono);letter-spacing:.16em;color:var(--gold)}
.halltag span{font-family:var(--display);font-size:16px;letter-spacing:.06em}
.halltag.h1{background:rgba(9,74,77,.92)}
@media (max-width:820px){.halltag{top:calc(env(safe-area-inset-top,0px) + 62px);padding:6px 12px}.halltag span{font-size:14px}}
button.brand{pointer-events:auto;border:0;cursor:pointer;transition:background .2s}
button.brand:hover{background:#000}
button.brand:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

.nav{position:fixed;top:50%;z-index:3;width:56px;height:56px;margin-top:-28px;border:0;border-radius:16px;
  background:var(--bar);color:var(--on-bar);line-height:1;cursor:pointer;
  display:grid;place-items:center;transition:transform .15s,opacity .2s,background .2s;
  box-shadow:0 8px 24px rgba(0,0,0,.25)}
.nav:hover{background:#000;transform:scale(1.06)}
.nav:disabled{opacity:.3;cursor:default;transform:none}
.nav.prev{left:max(16px,calc(env(safe-area-inset-left,0px) + 12px))}
.nav.next{right:max(16px,calc(env(safe-area-inset-right,0px) + 12px))}
.nav svg{width:24px;height:24px}

.hud{position:fixed;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:540px;background:var(--bar);color:var(--on-bar);border-radius:18px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:12px 14px 12px 18px;display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.3)}
.meta{min-width:0;transition:opacity .45s ease,transform .45s ease}
.meta.out{opacity:0;transform:translateY(6px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.name{font-family:var(--display);font-size:22px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url{font-family:var(--mono);font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.go{background:var(--on-bar);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;padding:10px 14px;border-radius:10px;white-space:nowrap}
.go[hidden]{display:none!important}
.dots{grid-column:1/-1;display:flex;gap:6px;justify-content:center;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--rule);cursor:pointer;transition:background .2s,transform .2s}
.dot.on{background:var(--on-bar);transform:scale(1.25)}
.nav:focus-visible,.dot:focus-visible,.go:focus-visible,.music:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

#css3d{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#css3d .label{pointer-events:auto}
#css3d iframe{pointer-events:none}   /* tabloya tıklama koridora gider: tam ekran açılır */
#stage.hot{cursor:zoom-in}
/* başa dönüşte geçilen her tablo için üstten inen buzlu cam: büyük Outsight logosu + proje no ve adı */
#pass{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:4;width:min(560px,calc(100vw - 32px));pointer-events:none;
  transform:translate(-50%,calc(-100% - 90px));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#pass.on{transform:translate(-50%,0)}
#pass .glass{background:linear-gradient(180deg,rgba(22,16,12,.72),rgba(22,16,12,.6));-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.45);border-radius:24px;padding:22px 26px 20px;text-align:center;color:#fff;
  box-shadow:0 18px 50px rgba(40,24,10,.28),inset 0 1px 0 rgba(255,255,255,.5)}
#pass img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));display:block;margin:0 auto 12px;width:min(340px,70%);height:auto}
#pass .lt{text-shadow:0 2px 10px rgba(0,0,0,.45);font:800 clamp(30px,7vw,48px)/1 var(--body);letter-spacing:.22em;margin:0 0 4px;padding-left:.22em}
#pass .ls{font:600 13px var(--body);letter-spacing:.5em;opacity:1;text-shadow:0 1px 6px rgba(0,0,0,.5);margin-bottom:14px;padding-left:.5em}
#pass .pn{font-family:var(--mono);font-size:14px;font-weight:500;letter-spacing:.16em;color:#ffd37f;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#pass .pt{font-family:var(--display);font-size:clamp(26px,5.4vw,38px);line-height:1.15;margin-top:4px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.35)}
@media (prefers-reduced-motion: reduce){#pass{transition:none}}
/* tablonun ortasındaki kavuniçi dokunma noktası (canlı sitenin de önünde görünür; tıklama arkadaki tabloya geçer) */
.hot3d{width:200px;height:200px;pointer-events:none!important;position:relative}
.hot3d i{position:absolute;inset:0;border-radius:50%;box-sizing:border-box}
.hot3d .o{border:13px solid #ff8c3a;box-shadow:0 0 0 5px rgba(255,255,255,.85),inset 0 0 0 5px rgba(255,255,255,.85)}
.hot3d .m{inset:22%;border:11px solid #ff8c3a;box-shadow:0 0 0 4px rgba(255,255,255,.8);animation:hotm 1.6s ease-in-out infinite}
.hot3d .d{inset:40%;background:#ff8c3a;box-shadow:0 0 0 5px #fff,0 0 30px 8px rgba(255,140,58,.7);animation:hotd 1.6s ease-in-out infinite}
@keyframes hotm{0%,100%{transform:scale(.55);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes hotd{0%,100%{transform:scale(1.25)}50%{transform:scale(.7)}}
@media (prefers-reduced-motion: reduce){.hot3d .m,.hot3d .d{animation:none}}
#stage.flag{cursor:pointer}
/* tam ekran görünüm: tabloya tıklayınca açılır, tekrar tıklayınca tabloya döner */
#viewer{position:fixed;inset:0;z-index:8;background:#0e0b08;opacity:0;transform:scale(.94);transition:opacity .45s ease,transform .45s ease;cursor:zoom-out}
#viewer[hidden]{display:none}
#viewer.on{opacity:1;transform:none}
#viewer iframe,#viewer img{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0e1420;object-fit:contain}
#viewer .catch{position:absolute;inset:0}
#viewer .vbar{position:absolute;z-index:1;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:var(--bar);color:var(--on-bar);padding:8px 8px 8px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px);white-space:nowrap}
#viewer .vname{font-family:var(--display);font-size:17px;overflow:hidden;text-overflow:ellipsis}
#viewer .vhint{font-family:var(--mono);font-size:11px;color:var(--muted)}
#viewer .vopen{background:var(--on-bar);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;cursor:pointer}
#viewer .vopen:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:520px){#viewer .vhint{display:none}}
/* bayrağa tıklayınca açılan proje bilgi penceresi */
#info{position:fixed;inset:0;z-index:8;display:grid;place-items:center;padding:16px;background:rgba(24,18,14,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s ease}
#info[hidden]{display:none}
#info.on{opacity:1}
#info .box{position:relative;width:100%;max-width:440px;background:#fbf6ec;color:#1b1712;border-radius:18px;border-top:8px solid var(--acc,#c49a45);box-shadow:0 24px 60px rgba(0,0,0,.4);padding:24px 24px 18px;transform:translateY(10px);transition:transform .3s ease}
#info.on .box{transform:none}
#info .no{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:#8a7c66;text-transform:uppercase}
#info h2{margin:6px 0 10px;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1}
#info p{margin:0 0 16px;font-size:15px;line-height:1.55;color:#4a4036}
#info dl{margin:0 0 18px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
#info dt{color:#8a7c66}
#info dd{margin:0;font-family:var(--mono);font-size:13px;word-break:break-all}
#info .acts{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #e3d8c4;padding-top:14px}
#info .open{color:#1b1712;font-weight:700;font-size:14px;text-decoration:none}
#info .close{border:0;cursor:pointer;background:#1b1712;color:#f6efe2;font:700 14px var(--body);padding:10px 18px;border-radius:10px}
#info .close:focus-visible,#info .open:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#css3d .story{pointer-events:none}
.live{width:1440px;height:900px;border:0;background:#0e1420;opacity:0;transition:opacity .9s ease;display:block}
.live.on{opacity:1}
/* tablonun sağındaki müze etiketi (gerçek bağlantı) */
.label{display:flex;flex-direction:column;gap:14px;box-sizing:border-box;width:620px;height:430px;padding:40px 44px;
  background:#fbf6ec;color:#1b1712;text-decoration:none;font-family:var(--body);border:3px solid #c9a24a;
  box-shadow:0 18px 40px rgba(60,40,20,.25);opacity:0;transition:opacity .6s ease}
.label.on{opacity:1}
.label:hover{background:#fffaf1}
.label .no{font-family:var(--mono);font-size:22px;color:#8a7c66;letter-spacing:.08em}
.label .t{font-family:var(--display);font-size:58px;line-height:1.02}
.label .d{font-size:26px;line-height:1.4;color:#4a4036}
.label .cta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:2px solid #1b1712;padding-top:16px;
  font-family:var(--mono);font-size:22px;color:#5a5044}
.label .cta b{font-family:var(--body);font-weight:700;color:#1b1712}

.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 58%,rgba(60,36,14,.32) 100%)}
.music{pointer-events:auto;border:0;cursor:pointer;background:var(--bar);color:var(--on-bar);
  padding:8px 14px;border-radius:999px;font-family:var(--body);font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.music .bars{display:flex;gap:2px;align-items:flex-end;height:12px;flex:none}
#mlabel{max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.music .bars i{width:3px;background:var(--gold);height:4px;border-radius:1px}
.music[aria-pressed="true"] .bars i{animation:eq 1s ease-in-out infinite}
.music[aria-pressed="true"] .bars i:nth-child(2){animation-delay:.2s}
.music[aria-pressed="true"] .bars i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
@media (prefers-reduced-motion: reduce){.music .bars i{animation:none!important}}
/* daktilo yazısı: tablonun hemen üstünde, duvara yazılmış gibi (zeminsiz) */
.story{width:1700px;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease;
  font-family:'Courier Prime','Courier New',monospace;font-size:118px;line-height:1.1;letter-spacing:.02em;color:#2a1c10;
  text-shadow:0 2px 0 rgba(255,250,240,.7),0 0 18px rgba(255,244,225,.6)}
.story.on{opacity:1}
.story .caret{display:inline-block;width:.07em;height:.9em;margin-left:.06em;background:currentColor;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.story .caret{animation:none}}
@media (max-width:480px){
  .nav{width:46px;height:46px;margin-top:-23px;border-radius:14px}
  .name{font-size:19px}
  .count{display:none}
}
/* giriş ekranı: tarayıcı sesi otomatik başlatmaya izin vermezse görünür */
#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:rgba(24,18,14,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;transition:opacity .6s ease}
#gate[hidden]{display:none}
#gate.out{opacity:0;pointer-events:none}
#gate .in{background:var(--bar);color:var(--on-bar);border-radius:20px;padding:28px 32px;text-align:center;max-width:min(360px,calc(100vw - 32px));box-shadow:0 18px 50px rgba(0,0,0,.35)}
#gate h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.06em}
#gate p{margin:0 0 20px;color:var(--muted);font-size:14px}
#gate button{border:0;cursor:pointer;background:var(--gold);color:#1b1712;font:700 15px var(--body);padding:12px 22px;border-radius:12px}
#gate button:focus-visible{outline:2px solid var(--on-bar);outline-offset:3px}
</style>

<div id="gate" hidden><div class="in"><h2>Proje Koridoru</h2><p>Müzikle birlikte gezmek için girin</p><button type="button">Koridora gir ♪</button></div></div>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="css3d"></div>
<div class="vignette"></div>

<div class="halltag" id="hallTag" aria-live="polite"><b id="hallNo">1. KORİDOR</b><span id="hallName">Yazılımlar</span></div>
<header class="top"><button class="brand" id="home" type="button" title="Koridorun başına dön">Proje <span>Koridoru</span></button>
  <button class="music" id="music" aria-pressed="false" title="KASIMOFF · Amor Mío (Original Mix)"><span class="bars"><i></i><i></i><i></i></span><span id="mlabel">Müzik</span></button>
</header>

<button class="nav prev" id="prev" aria-label="Önceki proje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="nav next" id="next" aria-label="Sonraki proje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

<div id="pass" aria-hidden="true"><div class="glass"><img alt="" hidden><div class="lt">OUTSIGHT</div><div class="ls">DANIŞMANLIK</div><div class="pn"></div><div class="pt"></div></div></div>
<div id="info" hidden role="dialog" aria-modal="true" aria-labelledby="infoName"><div class="box">
  <div class="no" id="infoNo"></div><h2 id="infoName"></h2><p id="infoDesc"></p>
  <dl><dt>Tür</dt><dd id="infoKind"></dd><dt>Alan</dt><dd id="infoTag"></dd><dt>Adres</dt><dd id="infoUrl"></dd></dl>
  <div class="acts"><a class="open" id="infoOpen" target="_blank" rel="noopener">Siteyi aç ↗</a><button type="button" class="close" id="infoClose">Kapat</button></div>
</div></div>

<div id="viewer" hidden role="dialog" aria-label="Proje tam ekran"><iframe title="Proje tam ekran" tabindex="-1"></iframe><img alt="" hidden><div class="catch" title="Tabloya dönmek için tıklayın"></div><div class="vbar"><span class="vname"></span><span class="vhint">tabloya dönmek için tıklayın</span><a class="vopen" target="_blank" rel="noopener">Yeni sekmede aç ↗</a></div></div>

<div class="hud">
  <div class="card" role="status" aria-live="polite">
    <div class="meta">
      <div class="eyebrow" id="eyebrow">Giriş</div>
      <div class="name" id="name">Projelerimiz</div>
      <div class="url" id="url">Turu başlatmak için ileri ›</div>
    </div>
    <div class="count" id="count"></div>
    <a class="go" id="go" href="#" target="_blank" rel="noopener" hidden>Siteyi aç ↗</a>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== PROJELER — adları, adresleri ve açıklamaları buradan düzenleyin ===== */
const PROJECTS = [
  /* hall: 0 = 1. koridor (yazılımlar), 1 = 2. koridor (web siteleri; 1. koridorun sonunda sağa dönülür) */
  { hall:0, name:"EihalePro",           url:"eihalepro.vercel.app",         tag:"SaaS · Satınalma",      desc:"B2B e-ihale ve e-tedarik platformu. Teklif ve eksiltmeler tek panelde.", accent:"#2f8fe0", kind:"Uygulama (SaaS)",
    about:"Şirketlerin tedarikçilerden teklif toplayıp elektronik ihale ve eksiltme yaptığı B2B satınalma platformu. İngiliz, Hollanda, Japon ve Brezilya tipi ihale türlerini destekliyor." },
  { hall:0, name:"Toygun",              url:"toygun.vercel.app",            tag:"Eğitim yönetimi",       desc:"Kolej ve kurslar için konsolide finans, idari, sınav ve ödeme takibi.",   accent:"#e0583a", kind:"Web uygulaması",
    about:"Bir ya da birden fazla kolej ve kursun finansal, idari, sınav ve ödeme takiplerini tek bir yazılım içinde konsolide olarak yaptığı yönetim uygulaması." },
  { hall:0, name:"Servis İvme",         url:"servisivme2.vercel.app",       tag:"Araç servis yönetimi",  desc:"Araç servisleri için finansal, idari ve servis kayıtları takibi.",         accent:"#c2185b", kind:"Web uygulaması",
    about:"Araç servislerinin finansal, idari ve servis kayıtlarının takip edildiği yazılım." },
  { hall:0, name:"Teknik Bizim İşimiz", url:"teknikbizimisimiz.vercel.app", tag:"Teknik hizmetler",      desc:"Teknik servis ve hizmet sitesi.",                                       accent:"#8a63d2", kind:"Web sitesi",
    about:"Teknik servis ve hizmet işleri için hazırlanmış tanıtım sitesi. Hizmetleri ve iletişim bilgilerini telefonda da rahat okunan sade bir düzende sunuyor." },
  { hall:0, name:"Outsight Danışmanlık", url:"www.outsight.com.tr",          tag:"Yönetim danışmanlığı",  desc:"Geleceği, bugünden tasarlayan bir strateji merkezi.",                   accent:"#2fae6b", kind:"Web sitesi",
    about:"Outsight Danışmanlık'ın kurumsal sitesi; satınalma, tedarik zinciri ve yönetim danışmanlığı hizmetlerini anlatıyor. Koridordaki tüm projelerin arkasındaki saha deneyimini temsil ediyor." },
  { hall:1, name:"Ishbee",              url:"ishbee.vercel.app",            tag:"Web platformu",         desc:"Kurumsal web platformu ve dijital çözümler.",                            accent:"#e3a72f", kind:"Web sitesi",
    about:"Ishbee'nin kurumsal web sitesi; markayı ve sunduğu dijital çözümleri tek bir yerde tanıtıyor. Zamanla ölçüm ve analiz odaklı bir platforma dönüşmesi planlanıyor." },
];
/* Canlı önizleme: esere varınca site çerçevenin içinde canlı açılır.
   "auto" = Vercel gibi kendi adresinizde açık, Claude önizlemesinde kapalı. true / false ile zorlayabilirsiniz. */
const LIVE_PREVIEW = "auto";
/* Outsight logosu (beyaz, şeffaf PNG). Vercel'de vercel.json bu yolu outsight.com.tr'deki logoya yönlendirir.
   Yüklenemezse yazı logosu kullanılır. */

function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function wrap(g,t,x,y,max,lh){let line='';for(const w of t.split(' ')){const s=line?line+' '+w:w;if(g.measureText(s).width>max&&line){g.fillText(line,x,y);line=w;y+=lh;}else line=s;}g.fillText(line,x,y);}
function rand(seed){return()=>((seed=Math.imul(seed^seed>>>15,seed|1)+0x6d2b79f5|0)>>>0)/4294967296;}
const canv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return[c,c.getContext('2d')];};
const tex=(c,rep)=>{const t=new THREE.CanvasTexture(c);t.anisotropy=8;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}return t;};
function goldGrad(g,y0,y1){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,'#f7e0a0');gr.addColorStop(.45,'#cf9f4c');gr.addColorStop(.55,'#ad7c32');gr.addColorStop(1,'#ebc77e');return gr;}
function spaced(g,text,cx,y,gap){const ws=[...text].map(ch=>g.measureText(ch).width),tot=ws.reduce((a,b)=>a+b,0)+gap*(ws.length-1);let x=cx-tot/2;[...text].forEach((ch,k)=>{g.fillText(ch,x,y);x+=ws[k]+gap;});}

/* ---------- CSS 3B katmanı: HTML öğelerini (etiket, canlı site) 3B sahneye yerleştirir ---------- */
function MiniCSS3D(container){
  const dom=document.createElement('div');dom.style.cssText='position:absolute;left:0;top:0;overflow:hidden;';
  const camEl=document.createElement('div');camEl.style.cssText='position:absolute;left:0;top:0;transform-style:preserve-3d;';
  dom.appendChild(camEl);container.appendChild(dom);
  const objs=[],eps=v=>Math.abs(v)<1e-10?0:v,_v=new THREE.Vector3();let W2=0,H2=0;
  return{
    add(el,o){el.style.position='absolute';el.style.left='0';el.style.top='0';camEl.appendChild(el);objs.push({el,o});},
    setSize(w,h){W2=w/2;H2=h/2;dom.style.width=camEl.style.width=w+'px';dom.style.height=camEl.style.height=h+'px';},
    render(cam){
      const fov=cam.projectionMatrix.elements[5]*H2;dom.style.perspective=fov+'px';
      const e=cam.matrixWorldInverse.elements;
      camEl.style.transform='translateZ('+fov+'px) matrix3d('+[e[0],-e[1],e[2],e[3],e[4],-e[5],e[6],e[7],e[8],-e[9],e[10],e[11],e[12],-e[13],e[14],e[15]].map(eps).join(',')+') translate('+W2+'px,'+H2+'px)';
      objs.forEach(({el,o})=>{if(el.style.visibility==='hidden')return;o.updateMatrixWorld();const m=o.matrixWorld.elements;
        // öğenin köşelerinden biri kameranın önünde değilse çizme (CSS 3B ters izdüşüm bozulması olur)
        if(el.offsetWidth){el._w=el.offsetWidth;el._h=el.offsetHeight;}const hw=(el._w||0)/2,hh=(el._h||0)/2;let ok=true;   // gizliyken boyut 0 okunur: son bilinen boyutu kullan
        for(const [cx,cy] of [[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]]){_v.set(cx,cy,0).applyMatrix4(o.matrixWorld).applyMatrix4(cam.matrixWorldInverse);if(_v.z>-cam.near*2){ok=false;break;}}
        el.style.display=ok?'':'none';if(!ok)return;
        el.style.transform='translate(-50%,-50%) matrix3d('+[m[0],m[1],m[2],m[3],-m[4],-m[5],-m[6],-m[7],m[8],m[9],m[10],m[11],m[12],m[13],m[14],m[15]].map(eps).join(',')+')';});
    }};
}

  function fade(to,ms,done){clearInterval(fadeT);const from=au.volume,t0=performance.now();
    fadeT=setInterval(()=>{const u=Math.max(0,Math.min(1,(performance.now()-t0)/ms));setVol(from+(to-from)*u);if(u>=1){clearInterval(fadeT);if(done)done();}},40);}

  let uiTimer=0;
  function ui(){
    $('prev').disabled=target<=-1;$('next').disabled=target>=N-1;
    [...dots.children].forEach((b,k)=>b.classList.toggle('on',k===target));
    const meta=document.querySelector('.meta');meta.classList.add('out');
    clearTimeout(uiTimer);uiTimer=setTimeout(()=>{fillUi();meta.classList.remove('out');},reduce?0:420);
  }
  function fillUi(){
    const link=$('go');
    if(target<0){$('eyebrow').textContent='Giriş';$('name').textContent='Projelerimiz';$('url').textContent='İleri › · tekerlek/orta tuşla yürü · sürükleyerek bak';$('count').textContent='';link.hidden=true;return;}
    const p=PROJECTS[target];
    $('eyebrow').textContent=(p.hall+1)+'. Koridor · '+p.tag;$('name').textContent=p.name;$('url').textContent=p.url;
    $('count').textContent=(target+1)+' / '+N;link.hidden=false;link.href='https://'+p.url;
  }
  $('prev').onclick=()=>go(target-1);
  $('next').onclick=()=>go(target+1);
  $('home').onclick=e=>{e.stopPropagation();closeViewer();closeInfo();const from=target;go(-1);if(anim&&from>0){homeRun=true;homeFrom=from;homeLast=from;
    if(!reduce)anim.dur=2400+Math.round(Math.abs(costOf(anim.to.s)-costOf(anim.from.s))/SP)*3000;}};   // dönüş yavaş: her tablonun camı rahat okunsun
  /* başa dönüş: geçilen her tablo için buzlu cam (ilk gidişte değil, yalnız dönüşte) */
  let homeRun=false,homeFrom=-1,homeLast=-1,passT=0;const pass=$('pass'),passImg=pass.querySelector('img');
  if(LOGO_IMAGE){passImg.onload=()=>{passImg.hidden=false;pass.querySelector('.lt').hidden=true;pass.querySelector('.ls').hidden=true;};passImg.src=LOGO_IMAGE;}
  function showPass(i){const p=PROJECTS[i];pass.querySelector('.pn').textContent='No. '+String(i+1).padStart(2,'0')+' · '+p.tag.toLocaleUpperCase('tr-TR');pass.querySelector('.pt').textContent=p.name;
    pass.classList.add('on');clearTimeout(passT);passT=setTimeout(()=>pass.classList.remove('on'),2100);}   // sol üstteki ad: koridorun başına dön
  // "Önce hayal edildi" → harf harf silinir → canlı site → "Şimdi gerçeğe dönüştü" (daktilo sesiyle)
  let storyTok=0;const storyTx=storyEl.querySelector('#storyText'),wait=ms=>new Promise(r=>setTimeout(r,ms));
  async function typeTxt(t,tok){for(const ch of t){if(tok!==storyTok)return false;storyTx.textContent+=ch;if(ch!==' ')Music.click(false);await wait(reduce?0:75+Math.random()*70);}return true;}
  async function eraseTxt(tok){while(storyTx.textContent.length){if(tok!==storyTok)return false;storyTx.textContent=storyTx.textContent.slice(0,-1);Music.click(true);await wait(reduce?0:45);}return true;}
  async function story(i){const tok=++storyTok;storyTx.textContent='';placeStory(i);storyEl.classList.add('on');
    await wait(400);if(!await typeTxt('Önce hayal edildi…',tok))return;
    await wait(1900);if(tok!==storyTok||!await eraseTxt(tok))return;
    revealLive(i);await wait(700);if(!await typeTxt('Şimdi gerçeğe dönüştü.',tok))return;
  }   // son yazı tablonun üstünde tabela gibi kalır; başka esere geçince silinir
  function stopStory(){storyTok++;storyEl.classList.remove('on');}
  // serbest yürüyüş (tekerlek, orta tuşla sürükleme, W/S) ve serbest bakış (sol tuş ya da parmakla sürükleme)
  // yürüyüş hızı (m/sn) ataletli: girdi hızlandırır, sürtünme yumuşakça durdurur
  const VMAX=1.6, keys={};
  function walk(dv){if(anim)anim=null;homeRun=false;if(!free){free=true;arrived=false;showActive(-1);stopStory();Music.play(null);}walkV=Math.max(-VMAX,Math.min(VMAX,walkV+dv));lastWalk=performance.now();Music.start();}
  /* bayrak bilgi penceresi */
  const info=$('info');let infoOpen=false,infoAt=0;
  function openInfo(i){const p=PROJECTS[i];info.querySelector('.box').style.setProperty('--acc',p.accent);
    $('infoNo').textContent='No. '+String(i+1).padStart(2,'0')+' · Proje';$('infoName').textContent=p.name;$('infoDesc').textContent=p.about||p.desc;$('infoKind').textContent=p.kind||'Proje';
    $('infoTag').textContent=p.tag;$('infoUrl').textContent=p.url;$('infoOpen').href='https://'+p.url;
    info.hidden=false;infoOpen=true;infoAt=performance.now();requestAnimationFrame(()=>requestAnimationFrame(()=>info.classList.add('on')));setTimeout(()=>$('infoClose').focus(),50);}
  function closeInfo(){if(!infoOpen)return;infoOpen=false;info.classList.remove('on');setTimeout(()=>{if(!infoOpen)info.hidden=true;},300);}
  $('infoClose').onclick=()=>{if(performance.now()-infoAt<300)return;closeInfo();};
  // açan tıklamanın kendisi (gecikmeli gelen tıklama dahil) pencereyi hemen kapatmasın
  info.addEventListener('click',e=>{if(performance.now()-infoAt<600)return;if(e.target===info)closeInfo();});
  /* tam ekran görünüm */
  const viewer=$('viewer'),vFrame=viewer.querySelector('iframe'),vImg=viewer.querySelector('img');let vOpen=-1,vAt=0;
  function openViewer(i){const p=PROJECTS[i];vOpen=i;vAt=performance.now();viewer.querySelector('.vname').textContent=p.name;const a=viewer.querySelector('.vopen');a.href='https://'+p.url;
    if(LIVE){vImg.hidden=true;vFrame.hidden=false;const u='https://'+p.url;if(vFrame.dataset.u!==u){vFrame.dataset.u=u;vFrame.src=u;}}
    else{vFrame.hidden=true;vImg.hidden=false;vImg.src=panels[i].art.material.map.image.toDataURL();}
    viewer.hidden=false;requestAnimationFrame(()=>requestAnimationFrame(()=>viewer.classList.add('on')));}
  function closeViewer(){if(vOpen<0)return;vOpen=-1;viewer.classList.remove('on');setTimeout(()=>{if(vOpen<0)viewer.hidden=true;},460);}
  // açan tıklamanın kendisi (dokunmatik ekranda gecikmeli gelen tıklama dahil) görünümü hemen kapatmasın
  viewer.addEventListener('click',e=>{if(e.target.closest('.vopen'))return;if(performance.now()-vAt<600)return;closeViewer();});
  // fare tabloların üstündeyken büyüteç imleci
  canvas.addEventListener('pointermove',e=>{if(drag)return;ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const fh=ray.intersectObjects(flagMeshes)[0];canvas.classList.toggle('hot',!fh&&!!ray.intersectObjects(artTargets)[0]);canvas.classList.toggle('flag',!!fh);});
  addEventListener('keydown',e=>{const k=e.key;
    if(infoOpen){if(k==='Escape'){e.preventDefault();closeInfo();}return;}
    if(vOpen>=0){if(k==='Escape'||k===' '||k==='Enter'){e.preventDefault();closeViewer();}return;}
    if(['ArrowRight',' '].includes(k)){e.preventDefault();go(target+1);}
    if(k==='ArrowLeft'){e.preventDefault();go(target-1);}
    if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();keys.f=true;}
    if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();keys.b=true;}});
  addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowUp'||k==='w'||k==='W')keys.f=false;if(k==='ArrowDown'||k==='s'||k==='S')keys.b=false;});
  addEventListener('wheel',e=>{if(e.target.closest&&e.target.closest('.hud,.top,.nav'))return;const d=e.deltaMode===1?e.deltaY*30:e.deltaY;walk(Math.max(-0.45,Math.min(0.45,d*0.0022)));},{passive:true});
  canvas.addEventListener('mousedown',e=>{if(e.button===1)e.preventDefault();});
  canvas.addEventListener('auxclick',e=>e.preventDefault());
  let tYaw=0,tPitch=0;   // sürüklenen bakış hedefi (kamera yumuşakça izler)
  canvas.addEventListener('pointerdown',e=>{drag={b:e.button,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,id:e.pointerId};try{canvas.setPointerCapture(e.pointerId);}catch(_){}});
  canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    if(drag.b===1)walk(-dy*0.012);
    else{tYaw=Math.max(-1.5,Math.min(1.5,tYaw-dx*0.004));tPitch=Math.max(-0.85,Math.min(0.85,tPitch-dy*0.0032));}});
  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
  const endDrag=e=>{if(!drag||drag.id!==e.pointerId)return;
    // tıklama (sürüklemesiz): tabloya tıklanırsa o esere git
    if(drag.b===0&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6){ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
      const fh=ray.intersectObjects(flagMeshes)[0],ah=ray.intersectObjects(artTargets)[0];
      if(fh&&(!ah||fh.distance<ah.distance)){openInfo(fh.object.userData.idx);drag=null;return;}
      const hit=ah;if(hit){const k=hit.object.userData.idx;if(k===target&&!free&&!anim)openViewer(k);else go(k);}}
    drag=null;};
  canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',()=>{drag=null;});
  canvas.addEventListener('dblclick',()=>{tYaw=0;tPitch=0;});
  const nearestIdx=s=>{if(s<sOfIdx(0)-4)return -1;let b=0;PROJECTS.forEach((p,i)=>{if(Math.abs(sOfIdx(i)-s)<Math.abs(sOfIdx(b)-s))b=i;});return b;};
  ui();fillUi();
  function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w/h<0.8?76:60;camera.updateProjectionMatrix();if(cssR)cssR.setSize(w,h);}
  addEventListener('resize',resize);resize();

  const clamp01=x=>x<0?0:x>1?1:x, ease=t=>-(Math.cos(Math.PI*t)-1)/2, look=new THREE.Vector3();
  let last=performance.now(), nextZap=1.5, curHall=0;
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000);last=now;
    // sinematik geçiş: eserden dön → halıdaki ada bakarak yürü → yeni esere dön
    let walkAmt=0;
    if(anim){
      const u=Math.min(1,(now-anim.t0)/anim.dur), F=anim.from, T=anim.to;
      const out=ease(clamp01(u/0.36)), walk=ease(clamp01((u-0.12)/0.74)), into=ease(clamp01((u-0.62)/0.38));
      pose.r=F.r*(1-out)+T.r*into;
      pose.l=F.l*(1-out)+T.l*into;
      const cF=costOf(F.s),cT=costOf(T.s);pose.s=sOfCost(cF+(cT-cF)*walk);
      walkAmt=Math.sin(Math.PI*clamp01((u-0.12)/0.74));
      if(homeRun){let hit=-1;for(let k=homeLast-1;k>=0;k--)if(pose.s<=sOfIdx(k)+1)hit=k;if(hit>=0){homeLast=hit;showPass(hit);}}   // tablonun hizasını geçince
      if(u>=1){anim=null;Object.assign(pose,T);}
    }
    { const hh=hallAt(pose.s);if(hh!==curHall){curHall=hh;$('hallNo').textContent=(hh+1)+'. KORİDOR';$('hallName').textContent=HALL_NAMES[hh];$('hallTag').classList.toggle('h1',hh===1);} }
    let glowAmt=walkAmt, freeAmt=0;
    if(free){
      if(keys.f)walkV=Math.min(VMAX,walkV+2.2*dt);if(keys.b)walkV=Math.max(-VMAX,walkV-2.2*dt);
      pose.s=Math.max(0,Math.min(S_MAX,pose.s+walkV*dt));
      if(pose.s<=0||pose.s>=S_MAX)walkV=0;
      walkV*=Math.exp(-dt*(keys.f||keys.b?0.8:2.2));if(Math.abs(walkV)<0.003)walkV=0;
      const k=1-Math.exp(-dt*1.4);pose.r-=pose.r*k;pose.l-=pose.l*k;   // esere bakıştan koridora yumuşak dönüş
      glowAmt=Math.min(1,Math.abs(walkV)/0.8);freeAmt=1;walkAmt=0;
      const ni=nearestIdx(pose.s);if(ni!==target){target=ni;ui();}
    }
    // bakış: sürüklenen hedefe yumuşakça yaklaşır
    const lk=1-Math.exp(-dt*6);lookYaw+=(tYaw-lookYaw)*lk;lookPitch+=(tPitch-lookPitch)*lk;
    const bob=reduce?0:Math.sin(now/340)*0.006*walkAmt;
    const breathe=reduce?0:Math.sin(now/3200)*0.04*(1-walkAmt)*(1-freeAmt);
    const gaze=walkAmt*0.5+(target<0&&!anim&&!free?0.3:0);   // otomatik geçişte bakış halıdaki ada iner
    const wp=worldPose(pose), yaw=wp.yaw+lookYaw, pitch=lookPitch-Math.atan(gaze/3);
    camera.position.set(wp.x+Math.sin(wp.yaw)*breathe,EYE+0.15+bob,wp.z-Math.cos(wp.yaw)*breathe);
    look.set(camera.position.x+Math.sin(yaw)*Math.cos(pitch)*3,camera.position.y+Math.sin(pitch)*3,camera.position.z-Math.cos(yaw)*Math.cos(pitch)*3);camera.lookAt(look);

    if(!arrived&&!anim&&!free){arrived=true;if(target>=0){showActive(target);story(target);zap(panels[target],30);zap(panels[target],30);}}
    panels.forEach((pn,k)=>{const on=k===target&&arrived;pn.wash.material.opacity+=((on?0.6:0.35)-pn.wash.material.opacity)*0.08;});
    // halıdaki ad: gidilen eserinki yürürken, beklerken sıradakininki parlar
    floorNames.forEach((m,k)=>{const want=((anim||free)&&k===target)?0.35+0.65*glowAmt:(!anim&&!free&&k===target+1)?0.35+0.15*Math.sin(now/600):0;
      m.material.opacity+=(want-m.material.opacity)*Math.min(1,dt*3);});
    // avize parıltısı ve pencere manzarası paralaksı
    glows.forEach((sp,k)=>{sp.material.opacity=0.55+0.07*Math.sin(now/700+k*1.7);});
    flags.forEach((f,k)=>{f.pivot.rotation.y=Math.sin(now/1100+k*2)*0.14;});
    hotspots.forEach(h=>{const t=reduce?0.5:0.5+0.5*Math.sin(now/520+h.ph);   // içteki halka ve nokta zıt yönde nefes alır
      h.mid.scale.setScalar(h.r*2*(0.45+0.4*t));h.mid.material.opacity=0.45+0.5*t;h.dot.scale.setScalar(h.r*2*(0.55-0.2*t));});
    logoSlots.forEach((sl,k)=>{if(sl.shine)sl.shine.material.opacity=0.08+Math.max(0,Math.sin(now/2600+k*0.9))*0.1;});

    nextZap-=dt;if(nextZap<=0){const c=panels.filter(pn=>pn.wpos.distanceTo(camera.position)<16);if(c.length)zap(c[(Math.random()*c.length)|0],12);nextZap=(reduce?5:1.6)+Math.random()*(reduce?4:2.2);}
    for(let k=0;k<MAX;k++){if(life[k]<=0)continue;life[k]-=dt;if(life[k]<=0){pos[k*3+1]=-999;continue;}
      vel[k*3+1]-=6*dt;pos[k*3]+=vel[k*3]*dt;pos[k*3+1]+=vel[k*3+1]*dt;pos[k*3+2]+=vel[k*3+2]*dt;
      if(pos[k*3+1]<Y0){pos[k*3+1]=Y0;vel[k*3+1]*=-0.3;vel[k*3]*=.5;vel[k*3+2]*=.5;}
      const q=life[k]/life0[k];col[k*3]=q;col[k*3+1]=q*(0.6+0.35*q);col[k*3+2]=q*q*0.4;}
    sg.attributes.position.needsUpdate=true;sg.attributes.color.needsUpdate=true;

    renderer.render(scene,camera);
    if(cssR){cssCam.fov=camera.fov;cssCam.aspect=camera.aspect;cssCam.near=camera.near*K;cssCam.far=camera.far*K;cssCam.updateProjectionMatrix();
      cssCam.position.copy(camera.position).multiplyScalar(K);cssCam.quaternion.copy(camera.quaternion);cssCam.updateMatrixWorld();cssR.render(cssCam);}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
boot();
</script>
